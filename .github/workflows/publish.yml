name: Publish to npm (trusted publishing / OIDC)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC — trusted publishing, no npm token needed
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install deps (prepare/build toolchain)
        run: |
          node --version; npm --version
          # setup-node 写入的空 authToken 行会让匿名装公共包也 401，先摘掉
          sed -i '/_authToken/d' ~/.npmrc || true
          set +e
          npm ci --no-audit --no-fund 2>&1 | tee install.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            sleep 20
            npm ci --no-audit --no-fund 2>&1 | tee -a install.log
            status=${PIPESTATUS[0]}
          fi
          exit $status

      - name: Diagnose (always)
        if: always()
        run: |
          {
            echo '### install.log tail'
            echo '```'
            tail -60 install.log 2>/dev/null || echo '(no install.log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure npm >= 11.5.5 (trusted publishing requirement)
        run: npm install -g npm@latest

      - name: Check version not already published
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          if npm view "$PKG_NAME@$PKG_VERSION" version 2>/dev/null; then
            echo "::error::$PKG_NAME@$PKG_VERSION already published. Bump version first."
            exit 1
          fi
          echo "Publishing $PKG_NAME@$PKG_VERSION"

      - name: Publish (provenance; output → step summary)
        run: |
          set -o pipefail
          npm publish --provenance --access public 2>&1 | tee publish.log

      # 2026-10-07 事故钉子：v0.9.52 首跑全步 success 但 registry 上迟迟查不到版本——
      # 实测 npmjs packument 提交是异步的（PUT 在 run 内完成，版本条目 8 分钟后才可见；
      # 历史版本滞后 1–4 分钟）。 publish 并未失败，是可见性延迟。此步防的是「真静默
      # no-op」：10 分钟内仍查不到才 fail（窗口须大于实测最大延迟）。
      - name: Verify version is live (fail on silent no-op)
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PKG_NAME=$(node -p "require('./package.json').name")
          for i in $(seq 1 60); do
            if npm view "$PKG_NAME@$PKG_VERSION" version 2>/dev/null; then
              echo "$PKG_NAME@$PKG_VERSION is live on the registry."
              exit 0
            fi
            echo "attempt $i/60: not visible yet, waiting 10s…"
            sleep 10
          done
          echo "::error::$PKG_NAME@$PKG_VERSION did NOT appear on the registry within 10 min — publish was a silent no-op."
          exit 1

      - name: Publish diagnostics (always)
        if: always()
        run: |
          {
            echo '### publish.log'
            echo '```'
            tail -80 publish.log 2>/dev/null || echo '(no publish.log)'
            echo '```'
            echo "npm $(npm --version) · registry $(npm config get registry)"
          } >> "$GITHUB_STEP_SUMMARY"
